<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Dev Quest | 網頁作品集入口</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Orbitron & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #ff007f;
            --neon-cyan: #00f3ff;
            --neon-purple: #9d00ff;
            --neon-green: #39ff14;
            --cyber-dark: #0a0a12;
            --glass-bg: rgba(18, 18, 32, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--cyber-dark);
            color: #ffffff;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 0, 127, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 243, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.1) 0%, transparent 60%);
            background-attachment: fixed;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* 賽博龐克背景網格與掃描線 */
        .cyber-grid {
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0, 0, 0, 0.3) 50%, rgba(0, 0, 0, 0.3));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 99;
            opacity: 0.6;
        }

        /* 毛玻璃卡片樣式 */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* 解鎖卡片 Hover 特效 */
        .glass-card-unlocked:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.4), inset 0 0 15px rgba(0, 243, 255, 0.2);
        }

        .glass-card-unlocked::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 243, 255, 0.1), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
            opacity: 0;
        }

        .glass-card-unlocked:hover::before {
            left: 100%;
            opacity: 1;
        }

        /* 鎖定卡片樣式 */
        .glass-card-locked {
            background: rgba(15, 15, 22, 0.5);
            border-color: rgba(255, 255, 255, 0.05);
            cursor: not-allowed;
            filter: grayscale(0.8);
            transition: all 0.3s ease;
        }

        .glass-card-locked:hover {
            border-color: rgba(255, 0, 127, 0.4);
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
            transform: translateY(-2px);
            filter: grayscale(0.3);
        }

        /* Y2K 霓虹流光頭像邊框 */
        .avatar-container {
            position: relative;
        }

        .avatar-container::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 9999px;
            background: linear-gradient(45deg, var(--neon-pink), var(--neon-cyan), var(--neon-purple), var(--neon-green));
            background-size: 400% 400%;
            animation: neonGlow 6s ease infinite;
            z-index: 0;
            filter: blur(8px);
        }

        @keyframes neonGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glitch 文字特效 */
        .glitch-text {
            text-shadow: 2px 2px var(--neon-pink), -2px -2px var(--neon-cyan);
            animation: glitch 3s infinite alternate-reverse;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--neon-pink), -2px -2px var(--neon-cyan); }
            25% { text-shadow: -2px 1px var(--neon-pink), 2px -1px var(--neon-cyan); }
            50% { text-shadow: 1px -2px var(--neon-pink), -1px 2px var(--neon-cyan); }
            75% { text-shadow: -1px -1px var(--neon-pink), 1px 1px var(--neon-cyan); }
            100% { text-shadow: 2px -1px var(--neon-pink), -2px 1px var(--neon-cyan); }
        }

        /* 鎖定彈窗搖晃動畫 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        .shake-anim {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
